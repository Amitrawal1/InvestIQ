<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestIQ · AI stock research for Indian markets</title>
    <meta name="description" content="InvestIQ ranks about 3,100 NSE-listed companies by price trend, financial health and news, with reasons and risks for every score. Research tool, not investment advice." />
    <meta name="theme-color" content="#050011" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InvestIQ" />
    <meta property="og:title" content="InvestIQ · AI stock research for Indian markets" />
    <meta property="og:description" content="Company rankings, financials and market news for NSE-listed companies, tested on history before they ship." />
    <meta name="twitter:card" content="summary" />
    <!-- Modern Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Apply the saved/system theme before React loads (no flash). Mirrors src/context/ThemeContext.jsx -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('investiq-theme') || 'system'; } catch (e) {}
        var theme = pref === 'light' || pref === 'dark' ? pref
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
